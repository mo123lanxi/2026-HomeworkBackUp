<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ECharts</title>
    <!-- 引入刚刚下载的 ECharts 文件 -->
    <script src="js/echarts.js"></script>
  </head>
  <body>
    <!-- 为 ECharts 准备一个定义了宽高的 DOM -->
    <div id="main" style="width: 600px;height:400px;"></div>
    <script type="text/javascript">
      // 基于准备好的dom，初始化echarts实例
      var myChart = echarts.init(document.getElementById('main'));

      // 指定图表的配置项和数据
      var option = {
        tooltip: {                      // 提示框组件
            trigger: 'axis',            // 触发类型
            position: function (pt) {   // 提示框位置
                return [pt[0], '10%'];
            },
            formatter: function (params) {      // 提示框内容格式化
                var tooltipText = params[0].name + '<br/>'; // 日期
                params.forEach(function (param) {
                    // 添加每个系列的数据和单位
                    tooltipText += param.marker + param.seriesName + ': ' + param.value + ' 万人<br/>';
                });
                return tooltipText;
            }
        },
        title: {        // 标题组件
            left: 'center',
            text: '不同年龄段的用户活跃度情况'
        },
        legend: {       // 图例组件
            data: ['18-24岁', '25-34岁', '35-49岁', '50-59岁'],
            top: '8%', 
        },
        toolbox: {      // 工具栏组件
            feature: {
                dataZoom: {     // 区域缩放工具
                    yAxisIndex: 'none'  // 不控制Y轴
                },
                restore: {},    // 区域缩放还原工具
                saveAsImage: {} // 保存为图片
            }
        },
        xAxis: {
            type: 'category',
            name: '时间',
            boundaryGap: false,     // 坐标轴两边不留白
            data: [
                '2019/10', '2019/11', '2019/12', 
                '2020/1', '2020/2', '2020/3', '2020/4', '2020/5', '2020/6', 
                '2020/7', '2020/8', '2020/9', '2020/10', '2020/11', '2020/12',
                '2021/1', '2021/2', '2021/3', '2021/4', '2021/5', '2021/6',

                '2022/1', '2022/2', '2022/3', '2022/4', '2022/5', '2022/6', 
                '2022/7', '2022/8', '2022/9', '2022/10', '2022/11', '2022/12',
                '2023/1', '2023/2', '2023/3', '2023/4', '2023/5', '2023/6', 
                '2023/7', '2023/8', '2023/9', '2023/10', '2023/11', '2023/12',
                ],
            axisTick: {     // 坐标轴刻度相关设置
              inside: true,  // 将刻度线朝内
              alignWithLabel: true  // 让刻度线与标签对齐
            }
        },
        yAxis: {
            type: 'value',
            name: '活跃人数/万',
            boundaryGap: [0, '100%'],   // 坐标轴两边留白
            axisLine: { 
              show: true, // 显示纵轴
              },
            axisTick: {
                show: true, // 显示刻度
                inside: true,  // 将刻度线朝内
              }
        },
        dataZoom: [      // 数据区域缩放组件
            {
                type: 'inside',     // 内置于坐标系中的缩放组件
                start: 5,           // 数据窗口范围的起始百分比
                end: 15             // 数据窗口范围的结束百分比
            },
            {
                type: 'slider',     // 滑块型数据区域缩放组件

                end: 10             // 数据窗口范围的结束百分比
            }
        ],
        series: [   // 系列列表
            {
                name: '18-24岁',
                type: 'line',   // 系列类型为线图
                sampling: 'lttb',   // 降采样策略
                symbol: 'circle', // 设置为圆形标记
                symbolSize: 8, // 设置标记的大小
                itemStyle: {
                    color: 'rgb(255, 70, 131)'
                },
                data: [
                    '24.1', '33.96', '21.37', 
                    '38.42', '21.09', '112.01', '83.96', '90.52', '108.8',

                    '81.53', '88.72', '87.96', '101.35', '98.53', '104.01', 
                    '96.78', '83.08', '87.63', '104.84', '109.44', '95.44',

                 '239.86', '259.34', '228.75', '267.76', '273.84', '272.37',

            ]

    };

      // 使用刚指定的配置项和数据显示图表
      myChart.setOption(option);

    </script>
  </body>
</html>
