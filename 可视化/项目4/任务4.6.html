<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ECharts</title>
    <!-- 引入刚刚下载的 ECharts 文件 -->
    <script src="js/echarts.js"></script>
  </head>
  <body>
    <!-- 为 ECharts 准备一个定义了宽高的 DOM -->
    <div id="main" style="width: 600px;height:400px;"></div>
    <script type="text/javascript">
      // 基于准备好的dom，初始化echarts实例
      var myChart = echarts.init(document.getElementById('main'));

      // 指定图表的配置项和数据
      var option = {
        title: {     // 标题组件
                text: '用户的满意度',
                left:'center'
            },
        tooltip: {  // 提示框组件
            formatter: '{a} <br/>{b} : {c}分'
        },
        series: [
            {
                name: '满意度',     // 设置系列名称
                type: 'gauge',    // 设置系列类型为仪表盘
                detail: {         // 仪表盘详情
                    formatter: '{value}'
                },
                data: [           // 设置系列数据
                    {
                        value: 82.7,
                        name: '得分'
                    }
                ],
                // 设置仪表盘的最大值和最小值
                min: 0,
                max: 100,
            }
        ]
    };

      // 使用刚指定的配置项和数据显示图表
      myChart.setOption(option);

    </script>
  </body>
</html>
